#cloud-config
# First-boot bootstrap. Rendered by stacks/dev-box/server.tf via templatefile().
# Runs ONCE on Ubuntu, converts the box to NixOS, then hands over to the flake.
# Nothing here is the box's config — that is hosts/dev-box/*.nix at the repo root.

write_files:
  # Bootstrap-only NixOS module, imported by the configuration.nix that
  # nixos-infect generates. Replaced entirely by the flake on the next boot.
  - path: /etc/nixos/host.nix
    permissions: "0644"
    content: |
      { pkgs, ... }:
      {
        nix.settings.experimental-features = [ "nix-command" "flakes" ];
        environment.systemPackages = [ pkgs.git ];

        # One-shot: build the flake's boot generation, make it default, reboot.
        # `boot` (not `switch`) so the unit is not killed by its own activation.
        # The flake config does not define this unit, so it never runs again.
        systemd.services.flake-bootstrap = {
          description = "Switch to ${flake_ref} and reboot";
          wantedBy = [ "multi-user.target" ];
          after = [ "network-online.target" ];
          wants = [ "network-online.target" ];
          path = [ pkgs.nixos-rebuild pkgs.nix pkgs.git pkgs.systemd ];
          serviceConfig.Type = "oneshot";
          script = '''
            set -euo pipefail
            nixos-rebuild boot --flake "${flake_ref}" --refresh 2>&1 | tee /var/log/flake-bootstrap.log
            systemctl reboot
          ''';
        };
      }

  - path: /usr/local/sbin/label-data-volume
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      # Wait for the Hetzner volume to attach, then give its filesystem the label
      # the flake mounts by. Idempotent: never formats, only labels.
      set -euo pipefail
      dev=/dev/disk/by-id/scsi-0HC_Volume_${volume_id}
      for _ in $(seq 1 120); do [ -e "$dev" ] && break; sleep 5; done
      [ -e "$dev" ] || { echo "volume $dev never appeared" >&2; exit 1; }
      fstype=$(blkid -o value -s TYPE "$dev" || true)
      [ "$fstype" = "ext4" ] || { echo "expected ext4 on $dev, got '$fstype'; refusing to touch it" >&2; exit 1; }
      e2label "$dev" data
      echo "labeled $dev as 'data'"

runcmd:
  - /usr/local/sbin/label-data-volume 2>&1 | tee /var/log/label-data-volume.log
  - curl -fsSL https://raw.githubusercontent.com/elitak/nixos-infect/${nixos_infect_ref}/nixos-infect | PROVIDER=hetznercloud NIXOS_IMPORT=./host.nix NIX_CHANNEL=${nixos_channel} bash 2>&1 | tee /tmp/infect.log
